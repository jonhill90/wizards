name: check
on:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate every tree
        run: |
          for t in wizards/*/tree.json; do python3 -I scripts/wizards_engine.py validate "$t"; done
      - name: unit tests
        run: python3 -I tests/test_wizards_engine.py
  verify-sources:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every quote is on its live page
        run: |
          for t in wizards/*/tree.json; do python3 -I scripts/wizards_engine.py verify-sources "$t"; done
