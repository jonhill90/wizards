<title id="t">Use Premium tier Geo-Replication, or build your own multi-namespace pattern</title><desc id="d">Use Premium tier Geo-Replication, or build your own multi-namespace pattern. Two regions side by side: the first holds Primary namespace; the second holds Secondary namespace. An arrow labelled Geo-Replication (Premium) joins them. Two boxes sit side by side, the primary region on the left and the second region on the right. The right box and its items are drawn in grey because they are not in use until needed. A black arrow between them is labelled Geo-Replication (Premium), and carries a green numbered circle.</desc>
