<title id="t">Run separate vaults in two regions and keep them in step yourself</title><desc id="d">Run separate vaults in two regions and keep them in step yourself. Two regions side by side: the first holds Key Vault; the second holds Second vault. An arrow labelled Backup and restore keep them in step joins them. Two boxes sit side by side, the primary region on the left and the second region on the right. The right box and its items are drawn in grey because they are not in use until needed. A black arrow between them is labelled Backup and restore keep them in step.</desc>
