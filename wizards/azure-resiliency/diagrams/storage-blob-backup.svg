<title id="t">Use Azure Backup for blobs</title><desc id="d">Use Azure Backup for blobs. Blob data on the left, Backup vault on the right, with an arrow labelled Vaulted backup. Features: Operational backup in the same account, Vaulted backup up to 10 years. A box labelled Protected data is on the left and a box labelled Backup is on the right. A solid black arrow labelled Vaulted backup points right. A dashed black arrow labelled Restore points back left. Grey bars inside the right box give the features.</desc>
