<title id="t">Back up the disks with Azure Disk Backup</title><desc id="d">Back up the disks with Azure Disk Backup. Managed disk on the left, Backup vault on the right, with an arrow labelled Disk Backup. Features: Incremental snapshots, Kept in your subscription. A box labelled Protected data is on the left and a box labelled Backup is on the right. A solid black arrow labelled Disk Backup points right. A dashed black arrow labelled Restore points back left. Grey bars inside the right box give the features.</desc>
