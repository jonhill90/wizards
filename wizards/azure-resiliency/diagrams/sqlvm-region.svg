<title id="t">Extend the availability group to a second region, or use log shipping, blob backups or Site Recovery</title><desc id="d">Extend the availability group to a second region, or use log shipping, blob backups or Site Recovery. Two regions side by side: the first holds Availability group replica; the second holds Replica, shipped logs or backups. An arrow labelled Replicas, log shipping or backups joins them. Two boxes sit side by side, the primary region on the left and the second region on the right. The right box and its items are drawn in grey because they are not in use until needed. A black arrow between them is labelled Replicas, log shipping or backups, and carries a green numbered circle.</desc>
