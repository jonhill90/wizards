<title id="t">Spread the VMs across availability zones</title><desc id="d">Spread the VMs across availability zones. One region drawn with 2 availability zones, each holding vm instance. Zone-spanning scale set across at least two zones. A solid black box labelled Region holds a dashed blue boundary. Inside are 2 blue panels, one for each availability zone, each repeating the same items. A green numbered circle marks the note under the box.</desc>
