<title id="t">Event Hubs is not storage: use Capture to keep copies of events</title><desc id="d">Event Hubs is not storage: use Capture to keep copies of events. Events on the left, Blob Storage on the right, with an arrow labelled Capture. Features: Events are held only for the retention period. A box labelled Protected data is on the left and a box labelled Backup is on the right. A solid black arrow labelled Capture points right, marked with a green circle numbered 1. Grey bars inside the right box give the features.</desc>
