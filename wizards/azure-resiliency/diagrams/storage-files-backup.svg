<title id="t">Use Azure Backup for Azure file shares</title><desc id="d">Use Azure Backup for Azure file shares. Azure file share on the left, Recovery Services vault on the right, with an arrow labelled Azure Backup. Features: Snapshot tier, Vaulted tier. A box labelled Protected data is on the left and a box labelled Backup is on the right. A solid black arrow labelled Azure Backup points right, marked with a green circle numbered 1. A dashed black arrow labelled Restore points back left, marked 2. Grey bars inside the right box give the features.</desc>
