<title id="t">Add a read region and turn on service-managed failover</title><desc id="d">Add a read region and turn on service-managed failover. Two regions side by side: the first holds Write region; the second holds Read region. An arrow labelled Service-managed failover joins them. Two boxes sit side by side, the primary region on the left and the second region on the right. A black arrow between them is labelled Service-managed failover, and carries a green numbered circle.</desc>
