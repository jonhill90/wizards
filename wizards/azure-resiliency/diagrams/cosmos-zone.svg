<title id="t">Turn on zone redundancy in each region</title><desc id="d">Turn on zone redundancy in each region. One region drawn with 3 availability zones, each holding replica. Zone redundancy is set per region. A solid black box labelled Region holds a dashed blue boundary. Inside are 3 blue panels, one for each availability zone, each repeating the same items. A green numbered circle marks the note under the box.</desc>
