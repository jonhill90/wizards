<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 173" width="700" height="173" font-family="'Segoe UI','Segoe UI_MSFontService',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Rely on the daily geo-backup, or add your own copy for a shorter RPO</title><desc id="d">Rely on the daily geo-backup, or add your own copy for a shorter RPO. Two regions side by side: the first holds Dedicated SQL pool; the second holds Pool restored from geo-backup. An arrow labelled Daily geo-backup joins them. Two boxes sit side by side, the primary region on the left and the second region on the right. The right box and its items are drawn in grey because they are not in use until needed. A black arrow between them is labelled Daily geo-backup, and carries a green numbered circle.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.4" markerHeight="5.4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#000000"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.4" markerHeight="5.4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#ff0000"/></marker><filter id="grey"><feColorMatrix type="saturate" values="0"/></filter></defs>
