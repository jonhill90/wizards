<title id="t">Back up the VMs with Azure Backup and harden the vault</title><desc id="d">Back up the VMs with Azure Backup and harden the vault. Virtual machine on the left, Recovery Services vault on the right, with an arrow labelled Azure Backup. Features: Immutable vault, Soft delete. A box labelled Protected data is on the left and a box labelled Backup is on the right. A solid black arrow labelled Azure Backup points right. A dashed black arrow labelled Restore points back left. Grey bars inside the right box give the features.</desc>
