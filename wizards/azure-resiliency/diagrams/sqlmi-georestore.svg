<title id="t">Use geo-redundant backups and geo-restore</title><desc id="d">Use geo-redundant backups and geo-restore. Two regions side by side: the first holds Instance; the second holds Database restored on an instance. An arrow labelled Geo-restore from geo-replicated backups joins them. Two boxes sit side by side, the primary region on the left and the second region on the right. The right box and its items are drawn in grey because they are not in use until needed. A black arrow between them is labelled Geo-restore from geo-replicated backups, and carries a green numbered circle.</desc>
