<text x="1015" y="291" font-size="10" text-anchor="middle" fill="#000000"><tspan x="1015" dy="0">Recovery</tspan><tspan x="1015" dy="12.0">Services vault</tspan></text>
<text x="371" y="250" font-size="10" text-anchor="middle" fill="#000000"><tspan x="371" dy="0">Protection agent</tspan></text>
<circle cx="377" cy="262" r="8.1" fill="#107c10"/>
<text x="377" y="265.2" font-size="9" text-anchor="middle" font-weight="600" fill="#ffffff"><tspan x="377" dy="0">1</tspan></text>
<circle cx="560" cy="262" r="8.1" fill="#107c10"/>
<text x="560" y="265.2" font-size="9" text-anchor="middle" font-weight="600" fill="#ffffff"><tspan x="560" dy="0">2</tspan></text>
<text x="905" y="254" font-size="10" text-anchor="middle" fill="#000000"><tspan x="905" dy="0">Online backup</tspan></text>
<circle cx="800" cy="262" r="8.1" fill="#107c10"/>
<text x="800" y="265.2" font-size="9" text-anchor="middle" font-weight="600" fill="#ffffff"><tspan x="800" dy="0">3</tspan></text>
<text x="905" y="300" font-size="10" text-anchor="middle" fill="#000000"><tspan x="905" dy="0">Restore</tspan></text>
<text x="505" y="332" font-size="10" text-anchor="start" fill="#000000"><tspan x="505" dy="0">DPMDB backup to Azure</tspan></text>
<circle cx="640" cy="340" r="8.1" fill="#107c10"/>
<text x="640" y="343.2" font-size="9" text-anchor="middle" font-weight="600" fill="#ffffff"><tspan x="640" dy="0">4</tspan></text>
<text x="940" y="543" font-size="10" text-anchor="start" fill="#000000"><tspan x="940" dy="0">Traffic or data path</tspan></text>
<text x="940" y="568" font-size="10" text-anchor="start" fill="#000000"><tspan x="940" dy="0">Optional or restore</tspan></text>
<text x="940" y="593" font-size="10" text-anchor="start" fill="#000000"><tspan x="940" dy="0">Two-way link</tspan></text>
<circle cx="40" cy="678" r="8.1" fill="#107c10"/>
<text x="40" y="681.2" font-size="9" text-anchor="middle" font-weight="600" fill="#ffffff"><tspan x="40" dy="0">1</tspan></text>
<text x="58" y="681.5" font-size="10" text-anchor="start" fill="#000000"><tspan x="58" dy="0">A MABS protection agent is installed on each machine that will be backed up. Machines and apps are backed up to local storage on the MABS server.</tspan></text>
<circle cx="40" cy="698" r="8.1" fill="#107c10"/>
<text x="40" y="701.2" font-size="9" text-anchor="middle" font-weight="600" fill="#ffffff"><tspan x="40" dy="0">2</tspan></text>
<text x="58" y="701.5" font-size="10" text-anchor="start" fill="#000000"><tspan x="58" dy="0">The MARS agent that runs on the MABS server backs up the MABS disks to a Recovery Services vault in Azure by using Azure Backup.</tspan></text>
<circle cx="40" cy="718" r="8.1" fill="#107c10"/>
<text x="40" y="721.2" font-size="9" text-anchor="middle" font-weight="600" fill="#ffffff"><tspan x="40" dy="0">3</tspan></text>
<text x="58" y="721.5" font-size="10" text-anchor="start" fill="#000000"><tspan x="58" dy="0">Online protection sends recovery points from MABS to the vault on the schedule you set.</tspan></text>
<circle cx="40" cy="738" r="8.1" fill="#107c10"/>
<text x="40" y="741.2" font-size="9" text-anchor="middle" font-weight="600" fill="#ffffff"><tspan x="40" dy="0">4</tspan></text>
<text x="58" y="741.5" font-size="10" text-anchor="start" fill="#000000"><tspan x="58" dy="0">The MABS database, DPMDB, holds the MABS configuration and backup data. Back it up to Azure too, so any MABS server registered in the vault can recover it.</tspan></text>
</svg>
