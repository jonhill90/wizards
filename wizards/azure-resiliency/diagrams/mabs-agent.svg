<text x="185" y="471.5" font-size="10" text-anchor="middle" fill="#737373"><tspan x="185" dy="0">Virtual machines with pass-through disks or</tspan><tspan x="185" dy="12.0">a remote VHD: use guest-level backup with an</tspan><tspan x="185" dy="12.0">agent on the VM</tspan></text>
