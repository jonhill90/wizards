<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 756" width="1200" height="756" font-family="'Segoe UI','Segoe UI_MSFontService',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Azure Backup Server protecting servers with a protection agent</title><desc id="d">Azure Backup Server protecting Hyper-V hosts, physical Windows servers and application servers through a protection agent on each, sending recovery points to a Recovery Services vault in Azure. A free-form drawing with 5 outlined areas: On-premises datacenter; Production servers; MABS server (dedicated Windows Server); Azure; Key. It holds 10 labelled items joined by 10 black arrows; dashed arrows are optional, standby or asynchronous paths. Arrow labels: Protection agent; Online backup; Restore; DPMDB backup to Azure; Traffic or data path; Optional or restore; Two-way link. Green numbered circles on arrows match the numbered notes under the drawing.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.4" markerHeight="5.4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#000000"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.4" markerHeight="5.4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#ff0000"/></marker></defs>
