<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" height="250" font-family="'Segoe UI','Segoe UI_MSFontService',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Traffic routing</title><desc id="d">Traffic routing. The wizard asks which failure you must survive: a zone failure, a region failure or data loss. The service icon is on a grey panel on the left. Black arrows lead from it to one box for each question the wizard asks.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.4" markerHeight="5.4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#000000"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.4" markerHeight="5.4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#ff0000"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="30" y="30" width="260" height="190" rx="0" fill="#f2f2f2" stroke="#bfbfbf" stroke-width="1"/>
<text x="160" y="132" font-size="12" text-anchor="middle" font-weight="600" fill="#000000"><tspan x="160" dy="0">Traffic routing</tspan></text>
<text x="480" y="62" font-size="12" text-anchor="middle" font-weight="600" fill="#000000"><tspan x="480" dy="0">This wizard asks which failure</tspan></text>
<text x="480" y="78" font-size="12" text-anchor="middle" font-weight="600" fill="#000000"><tspan x="480" dy="0">you must survive:</tspan></text>
<rect x="380" y="98" width="200" height="32" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.75"/>
<text x="480" y="118" font-size="10" text-anchor="middle" fill="#000000"><tspan x="480" dy="0">Zone failure</tspan></text>
<polyline points="290,125 330,125 330,114 380,114" fill="none" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="380" y="142" width="200" height="32" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.75"/>
<text x="480" y="162" font-size="10" text-anchor="middle" fill="#000000"><tspan x="480" dy="0">Region failure</tspan></text>
<polyline points="290,125 330,125 330,158 380,158" fill="none" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="380" y="186" width="200" height="32" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.75"/>
<text x="480" y="206" font-size="10" text-anchor="middle" fill="#000000"><tspan x="480" dy="0">Data loss</tspan></text>
<polyline points="290,125 330,125 330,202 380,202" fill="none" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
