<title id="t">Protect the underlying storage</title><desc id="d">Protect the underlying storage. Databricks on the left, Your storage accounts on the right, with an arrow labelled Production data lives here. Features: Protect it as storage. A box labelled Protected data is on the left and a box labelled Backup is on the right. A solid black arrow labelled Production data lives here points right, marked with a green circle numbered 1. Grey bars inside the right box give the features.</desc>
