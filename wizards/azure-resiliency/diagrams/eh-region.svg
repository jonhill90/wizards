<title id="t">Use geo-replication on Premium or Dedicated, or metadata geo-disaster recovery</title><desc id="d">Use geo-replication on Premium or Dedicated, or metadata geo-disaster recovery. Two regions side by side: the first holds Primary namespace; the second holds Secondary namespace. An arrow labelled Geo-replication (Premium or Dedicated) joins them. Two boxes sit side by side, the primary region on the left and the second region on the right. The right box and its items are drawn in grey because they are not in use until needed. A black arrow between them is labelled Geo-replication (Premium or Dedicated).</desc>
