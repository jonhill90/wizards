<title id="t">Back up the VMs with Azure Backup</title><desc id="d">Back up the VMs with Azure Backup. Virtual machine on the left, Recovery Services vault on the right, with an arrow labelled Azure Backup. Features: Soft delete on by default. A box labelled Protected data is on the left and a box labelled Backup is on the right. A solid black arrow labelled Azure Backup points right, marked with a green circle numbered 1. A dashed black arrow labelled Restore points back left, marked 2. Grey bars inside the right box give the features.</desc>
