<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 285" width="700" height="285" font-family="'Segoe UI','Segoe UI_MSFontService',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Choose zone-redundant disks, or replicate at the application level</title><desc id="d">Choose zone-redundant disks, or replicate at the application level. One region drawn with 3 availability zones, each holding zrs disk. LRS disks need the application or Site Recovery. A solid black box labelled Region holds a dashed blue boundary. Inside are 3 blue panels, one for each availability zone, each repeating the same items. A black arrow below the panels is labelled Synchronous copy across zones. A green numbered circle marks the note under the box.</desc>
