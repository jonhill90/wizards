<title id="t">Managed disks have no geo option: replicate the VM with Azure Site Recovery</title><desc id="d">Managed disks have no geo option: replicate the VM with Azure Site Recovery. Two regions side by side: the first holds Virtual machine, Disks; the second holds Replicated virtual machine, Replica disks. An arrow labelled Azure Site Recovery joins them. Two boxes sit side by side, the primary region on the left and the second region on the right. The right box and its items are drawn in grey because they are not in use until needed. A black arrow between them is labelled Azure Site Recovery.</desc>
