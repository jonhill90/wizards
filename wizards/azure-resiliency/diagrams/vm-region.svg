<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 173" width="700" height="173" font-family="'Segoe UI','Segoe UI_MSFontService',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Replicate the VMs to a second region with Azure Site Recovery</title><desc id="d">Replicate the VMs to a second region with Azure Site Recovery. Two regions side by side: the first holds Virtual machine; the second holds Replicated virtual machine. An arrow labelled Azure Site Recovery replication joins them. Two boxes sit side by side, the primary region on the left and the second region on the right. The right box and its items are drawn in grey because they are not in use until needed. A black arrow between them is labelled Azure Site Recovery replication, and carries a green numbered circle.</desc>
