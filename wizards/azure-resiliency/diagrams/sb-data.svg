<title id="t">Service Bus has no backup: archive messages in your application</title><desc id="d">Service Bus has no backup: archive messages in your application. Messages on the left, Azure Storage or another durable store on the right, with an arrow labelled You save what you must keep. Features: No backup or restore in the service. A box labelled Protected data is on the left and a box labelled Backup is on the right. A solid black arrow labelled You save what you must keep points right. Grey bars inside the right box give the features.</desc>
