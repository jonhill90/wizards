<title id="t">Azure Kubernetes Service</title><desc id="d">Azure Kubernetes Service. The wizard asks which failure you must survive: a zone failure, a region failure or data loss. The service icon is on a grey panel on the left. Black arrows lead from it to one box for each question the wizard asks.</desc>
