<title id="t">Make the App Service plan zone redundant</title><desc id="d">Make the App Service plan zone redundant. One region drawn with 2 availability zones, each holding plan instance. Premium v2 to v4 plan, at least two instances. A solid black box labelled Region holds a dashed blue boundary. Inside are 2 blue panels, one for each availability zone, each repeating the same items. A green numbered circle marks the note under the box.</desc>
