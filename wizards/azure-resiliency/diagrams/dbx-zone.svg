<title id="t">Rely on the control plane and make your own compute plane zone-redundant</title><desc id="d">Rely on the control plane and make your own compute plane zone-redundant. One region drawn with 3 availability zones, each holding compute plane, your job. The control plane recovers from a zone failure automatically. A solid black box labelled Region holds a dashed blue boundary. Inside are 3 blue panels, one for each availability zone, each repeating the same items. A green numbered circle marks the note under the box.</desc>
