<title id="t">Nothing to turn on for Fabric itself; check external storage</title><desc id="d">Nothing to turn on for Fabric itself; check external storage. One region drawn with 3 availability zones, each holding fabric resources. Data outside OneLake needs zone-redundant storage. A solid black box labelled Region holds a dashed blue boundary. Inside are 3 blue panels, one for each availability zone, each repeating the same items. A green numbered circle marks the note under the box.</desc>
