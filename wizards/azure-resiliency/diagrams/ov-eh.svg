<title id="t">Azure Event Hubs</title><desc id="d">Azure Event Hubs. The wizard asks which failure you must survive: a zone failure, a region failure or data loss. The service icon is on a grey panel on the left. Black arrows lead from it to one box for each question the wizard asks.</desc>
