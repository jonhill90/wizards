<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 173" width="700" height="173" font-family="'Segoe UI','Segoe UI_MSFontService',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Build a second workspace and replicate it yourself</title><desc id="d">Build a second workspace and replicate it yourself. Two regions side by side: the first holds Primary workspace; the second holds Second workspace you build. An arrow labelled Terraform and Delta Deep Clone joins them. Two boxes sit side by side, the primary region on the left and the second region on the right. The right box and its items are drawn in grey because they are not in use until needed. A black arrow between them is labelled Terraform and Delta Deep Clone, and carries a green numbered circle.</desc>
