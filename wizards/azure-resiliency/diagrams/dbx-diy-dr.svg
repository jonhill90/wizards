<g transform="translate(519.00 86.00) scale(1.7778)" filter="url(#grey)" opacity="0.8"><path d="M1.155,4.93v.512L9,9.868l7.006-3.957,0,1.6L9,11.491,1.55,7.258l-.395.22V10.54L9,14.955l7.006-3.942,0,1.586L9,16.581,1.55,12.347l-.395.22v.519L9,17.5l7.845-4.414V10.021l-.4-.218L9,14.036,1.992,10.054V8.476L9,12.414,16.845,8V4.978l-.4-.219L9,8.993,2.352,5.215,9,1.46l5.476,3.094.479-.269V3.863L9,.5Z" fill="#ff3621" /></g>
<text x="535" y="131" font-size="10" text-anchor="middle" fill="#737373"><tspan x="535" dy="0">Second workspace you build</tspan></text>
