<title id="t">Use active geo-replication</title><desc id="d">Use active geo-replication. Two regions side by side: the first holds Primary database; the second holds Readable secondary. An arrow labelled Active geo-replication joins them. Two boxes sit side by side, the primary region on the left and the second region on the right. A black arrow between them is labelled Active geo-replication, and carries a green numbered circle.</desc>
