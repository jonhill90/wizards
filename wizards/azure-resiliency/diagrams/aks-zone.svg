<title id="t">Spread the node pools and the pods across zones</title><desc id="d">Spread the node pools and the pods across zones. One region drawn with 3 availability zones, each holding node pool and pod replicas. The control plane is already zone resilient. A solid black box labelled Region holds a dashed blue boundary. Inside are 3 blue panels, one for each availability zone, each repeating the same items. A green numbered circle marks the note under the box.</desc>
