<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 173" width="700" height="173" font-family="'Segoe UI','Segoe UI_MSFontService',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Use geo-zone-redundant storage (GZRS)</title><desc id="d">Use geo-zone-redundant storage (GZRS). Two regions side by side: the first holds Primary region, zone-redundant; the second holds Secondary region copy. An arrow labelled Asynchronous copy joins them. Two boxes sit side by side, the primary region on the left and the second region on the right. The right box and its items are drawn in grey because they are not in use until needed. A black arrow between them is labelled Asynchronous copy, and carries a green numbered circle.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.4" markerHeight="5.4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#000000"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.4" markerHeight="5.4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#ff0000"/></marker><filter id="grey"><feColorMatrix type="saturate" values="0"/></filter></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="30" y="56" width="270" height="93" rx="0" fill="#e6f2fb" stroke="#0078d4" stroke-width="0.75"/>
